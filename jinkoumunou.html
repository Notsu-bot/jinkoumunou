<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工無脳</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b6bcc2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="人工無脳">
<style>
  :root{
    --page-top:#c9cdd1; --page-bottom:#9099a1;
    --phone-bg:#e4e6e9;
    --nav-top:#f4f5f6; --nav-bottom:#b6bcc2; --nav-border:#7d838a;
    --text-main:#222325;
    --border:#9aa0a6;
    --bubble-bot-top:#ffffff; --bubble-bot-bottom:#e1e4e7; --bubble-bot-border:#a9adb2; --bubble-bot-text:#1c1c1e;
    --bubble-user-top:#a7e56a; --bubble-user-bottom:#4f9e26; --bubble-user-border:#2e6e12; --bubble-user-text:#183a08;
    --input-bg:#ffffff; --input-border:#9199a1;
    --dim:#5c6167;
    --link:#2f5f95;
    --btn-top:#ffffff; --btn-bottom:#c9ced3; --btn-border:#868c92; --btn-text:#2a2d30;
    --tab-top:#e6e8ea; --tab-bottom:#aab0b6; --tab-border:#6d7278;
    --sheet-bg:#eceeef;
  }
  body.dark{
    --page-top:#4a4a4c; --page-bottom:#1c1c1e;
    --phone-bg:#2a2a2c;
    --nav-top:#5c5c5e; --nav-bottom:#232324; --nav-border:#0a0a0a;
    --text-main:#f0f0f2;
    --border:#000000;
    --bubble-bot-top:#57585a; --bubble-bot-bottom:#333436; --bubble-bot-border:#0f0f10; --bubble-bot-text:#f2f2f4;
    --bubble-user-top:#8fdb59; --bubble-user-bottom:#3f8a1f; --bubble-user-border:#1f4d0d; --bubble-user-text:#102a05;
    --input-bg:#1e1e20; --input-border:#050505;
    --dim:#a3a6aa;
    --link:#7fb3ef;
    --btn-top:#666668; --btn-bottom:#2c2c2e; --btn-border:#000000; --btn-text:#f0f0f2;
    --tab-top:#4a4a4c; --tab-bottom:#1a1a1b; --tab-border:#000000;
    --sheet-bg:#242426;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:linear-gradient(180deg, var(--page-top), var(--page-bottom));
    color:var(--text-main);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .glossy{
    background:linear-gradient(to bottom, var(--btn-top) 0%, var(--btn-bottom) 100%);
    border:1px solid var(--btn-border);
    border-radius:6px;
    color:var(--btn-text);
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(0,0,0,.3);
  }
  body.dark .glossy{ text-shadow:0 -1px 0 rgba(0,0,0,.6); box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 1px 2px rgba(0,0,0,.5); }
  .glossy:active{
    background:linear-gradient(to bottom, var(--btn-bottom) 0%, var(--btn-top) 100%);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
  }

  .phone{
    position:relative;
    width:100%; max-width:400px; height:86vh; max-height:760px;
    background:var(--phone-bg); border-radius:16px; overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 0 0 1px rgba(0,0,0,.4), 0 20px 44px rgba(0,0,0,.4);
    display:flex; flex-direction:column;
  }
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; flex-shrink:0; z-index:2;
    background:linear-gradient(to bottom, var(--nav-top) 0%, var(--nav-bottom) 100%);
    border-bottom:1px solid var(--nav-border);
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
  }
  .hdrbtn{ font-size:13px; font-weight:600; padding:6px 12px; position:relative; min-width:40px; text-align:center; }
  .hdrbtn.invisible{ visibility:hidden; pointer-events:none; }
  .hdrbtn.back{ padding-left:16px; text-align:left; }
  .hdrbtn.back::before{
    content:""; position:absolute; left:5px; top:50%; width:7px; height:7px;
    border-left:2px solid var(--btn-text); border-bottom:2px solid var(--btn-text);
    transform:translateY(-50%) rotate(45deg);
  }
  .header .titlewrap{ text-align:center; flex:1; overflow:hidden; }
  .header .title{ font-weight:700; font-size:16px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px rgba(0,0,0,.35); color:#1a1c1e; }
  body.dark .header .title{ color:#fafafa; text-shadow:0 1px 1px rgba(0,0,0,.6); }
  .header .subtitle{ font-size:11px; color:var(--dim); margin-top:1px; }

  .tabpanel{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .panel{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .hidden{ display:none !important; }

  .log{
    flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px;
    background-size:cover; background-position:center;
    background-color:#dde0e3;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0px, rgba(0,0,0,.02) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 3px);
  }
  body.dark .log{ background-color:#1c1c1e; }
  .timestamp{ text-align:center; color:var(--dim); font-size:11px; margin:8px 0 2px; text-shadow:0 1px 0 rgba(255,255,255,.4); }

  @keyframes bubbleIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .row{ display:flex; align-items:flex-end; gap:6px; animation:bubbleIn .22s ease-out; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }
  .avatar{
    width:30px;height:30px;border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:700; overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.6), inset 0 -3px 4px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.35);
    border:1px solid rgba(0,0,0,.3);
  }
  .avatar svg{ width:60%; height:60%; fill:#fff; }
  .avatar.big{ width:46px; height:46px; font-size:17px; }
  .col{ display:flex; flex-direction:column; max-width:70%; }
  .col.user{ align-items:flex-end; }
  .col.bot{ align-items:flex-start; }
  .botname{ font-size:11px; margin:0 0 2px 4px; font-weight:700; text-shadow:0 1px 0 rgba(255,255,255,.4); }
  .msgtime{ font-size:10px; color:var(--dim); margin:2px 4px 0; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  .msgtime-side{ font-size:10px; color:var(--dim); white-space:nowrap; flex-shrink:0; padding-bottom:3px; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  .imagebubble{ padding:4px !important; background:none !important; border:none !important; box-shadow:none !important; }
  .imagebubble::after{ display:none; }
  .msgimage{ display:block; max-width:200px; max-height:200px; border-radius:12px; border:1px solid var(--border); }
  .photobtn{ padding:8px 10px; font-size:16px; flex-shrink:0; }
  .bubble{
    position:relative; padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; border:1px solid; max-width:100%;
  }
  .bubble.bot{
    background:linear-gradient(to bottom, var(--bubble-bot-top) 0%, var(--bubble-bot-bottom) 100%);
    border-color:var(--bubble-bot-border); color:var(--bubble-bot-text);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 1px 2px rgba(0,0,0,.2);
  }
  .bubble.bot::after{
    content:""; position:absolute; left:-7px; bottom:6px; width:0; height:0;
    border:7px solid transparent; border-right-color:var(--bubble-bot-bottom); border-left:0;
  }
  .bubble.user{
    background:linear-gradient(to bottom, var(--bubble-user-top) 0%, var(--bubble-user-bottom) 100%);
    border-color:var(--bubble-user-border); color:var(--bubble-user-text);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(0,0,0,.25);
  }
  .bubble.user::after{
    content:""; position:absolute; right:-7px; bottom:6px; width:0; height:0;
    border:7px solid transparent; border-left-color:var(--bubble-user-bottom); border-right:0;
  }
  .voterow{ display:flex; gap:12px; margin:4px 4px 0; }
  .votebtn{ display:flex; align-items:center; gap:4px; background:none; border:none; padding:2px; font-size:11px; color:var(--dim); cursor:pointer; font-family:inherit; }
  .votebtn svg{ width:14px; height:14px; fill:var(--dim); }
  .votebtn:disabled{ opacity:.55; cursor:default; }
  .votebtn.active svg{ fill:var(--link); }
  .votebtn.active span{ color:var(--link); font-weight:700; }

  .reactrow{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 4px 0; }
  .reactchip{ background:var(--input-bg); border:1px solid var(--input-border); border-radius:12px; padding:2px 8px; font-size:12px; color:var(--text-main); cursor:pointer; font-family:inherit; }
  .reactchip.active{ border-color:var(--link); }
  .reactchip.add{ font-weight:700; color:var(--dim); }
  .emojiBtn{ font-size:22px; padding:8px 10px; border-radius:8px; }

  .quoteblock{ border-left:3px solid var(--dim); padding:3px 8px; margin-bottom:4px; font-size:12px; color:var(--dim); background:rgba(0,0,0,.04); border-radius:4px; max-width:100%; }
  .quoteblock .quotename{ font-weight:700; }
  .quoteblock .quotetext{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .replypreview{ display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--input-bg); border-top:1px solid var(--border); flex-shrink:0; }
  .replypreview .replyinfo{ flex:1; min-width:0; font-size:12px; }
  .replypreview .replyname{ font-weight:700; color:var(--link); }
  .replypreview .replytext{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); }
  .replypreview .replycancel{ background:none; border:none; color:var(--dim); font-size:14px; cursor:pointer; }

  .versionfooter{ text-align:center; font-size:11px; color:var(--dim); padding:16px 0 4px; }

  .profilewrap{ flex:1; overflow-y:auto; background:var(--sheet-bg); }
  .profilebanner{ height:130px; background-size:cover; background-position:center; background-color:#8a8f95; }
  .profileavatarwrap{ display:flex; justify-content:center; margin-top:-42px; }
  .profileavatar{ width:84px; height:84px; font-size:30px; border:4px solid var(--sheet-bg); }
  .profilename{ text-align:center; font-size:18px; font-weight:700; margin-top:10px; }
  .profilestatus{ text-align:center; font-size:13px; color:var(--dim); margin-top:6px; padding:0 24px; }
  .profileactions{ display:flex; gap:10px; justify-content:center; margin-top:22px; padding:0 20px; }
  .profileactions button{ flex:1; max-width:140px; padding:10px; }

  .inputbar{
    display:flex; align-items:center; gap:8px; padding:8px 10px; flex-shrink:0;
    background:linear-gradient(to bottom, var(--tab-top) 0%, var(--tab-bottom) 100%);
    border-top:1px solid var(--tab-border);
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
  }
  .inputbar input{
    flex:1; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text-main);
    border-radius:6px; padding:8px 12px; font-size:15px; outline:none; font-family:inherit;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
  }
  .inputbar button{ font-size:14px; padding:8px 14px; cursor:pointer; font-family:inherit; }

  .tabbar{
    display:flex; flex-shrink:0;
    background:linear-gradient(to bottom, var(--tab-top) 0%, var(--tab-bottom) 100%);
    border-top:1px solid var(--tab-border);
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
  }
  .tabbtn{
    flex:1; background:none; border:none; border-right:1px solid rgba(0,0,0,.08);
    padding:8px 2px 7px; font-size:11px; color:var(--dim); font-family:inherit; cursor:pointer;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .tabbtn:last-child{ border-right:none; }
  .tabbtn .icon{ display:block; font-size:18px; line-height:1; margin-bottom:2px; filter:grayscale(1) opacity(.7); }
  .tabbtn.active{ color:var(--link); font-weight:700; }
  .tabbtn.active .icon{ filter:none; }

  .listwrap{ flex:1; overflow-y:auto; padding:6px 12px; background:var(--sheet-bg); }
  .listrow{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .listinfo{ flex:1; min-width:0; }
  .listname{ font-size:14px; font-weight:700; }
  .listpreview{ font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .delbadge{
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(to bottom,#ff6b5e,#d32e1f);
    border:1px solid #8f1c10; color:#fff; font-size:14px; line-height:18px; text-align:center;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 1px 2px rgba(0,0,0,.3);
    cursor:pointer;
  }

  .settingswrap{ flex:1; overflow-y:auto; padding:6px 16px 20px; background:var(--sheet-bg); }
  .section{ padding:12px 0; border-bottom:1px solid var(--border); }
  .section:last-child{ border-bottom:none; }
  .section-title{ font-size:13px; color:var(--dim); margin-bottom:8px; font-weight:600; }
  .switchrow{ display:flex; justify-content:space-between; align-items:center; }
  .switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; background:linear-gradient(to bottom,#c7c7c7,#e8e8e8); border-radius:16px; transition:.15s; cursor:pointer;
    border:1px solid #8c8c8c; box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
  }
  .slider:before{
    content:""; position:absolute; height:24px; width:24px; left:2px; top:1px;
    background:linear-gradient(to bottom,#ffffff,#d4d4d4); border-radius:50%; transition:.15s;
    box-shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.8) inset;
  }
  .switch input:checked + .slider{ background:linear-gradient(to bottom,#8fdb59,#4f9e26); border-color:#2e6e12; }
  .switch input:checked + .slider:before{ transform:translateX(20px); }
  .actionbtn{ width:100%; text-align:left; padding:10px 12px; font-size:14px; margin-top:8px; cursor:pointer; font-family:inherit; }
  .actionbtn.danger{ color:#a02020; }
  .bgpreview{
    width:100%; height:80px; border-radius:6px; background-size:cover; background-position:center;
    background-color:var(--input-bg); margin-bottom:8px; border:1px solid var(--input-border); box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
  }
  .filerow{ display:flex; gap:8px; }
  .filerow label{ flex:1; text-align:center; padding:9px; font-size:13px; cursor:pointer; }
  .filerow input[type=file]{ display:none; }
  .forminput{
    width:100%; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text-main);
    border-radius:6px; padding:8px 10px; font-size:14px; font-family:inherit; box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
  }
  select.forminput{ -webkit-appearance:none; appearance:none; }
  .memberrow{ display:flex; align-items:center; gap:8px; padding:7px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
  .memberrow input[type=checkbox]{ width:18px; height:18px; flex-shrink:0; }
  .memberrow span{ font-size:14px; }
  .vocabrow{ display:flex; justify-content:space-between; align-items:center; padding:5px 2px; border-bottom:1px solid var(--border); font-size:13px; }
  .vocabrow span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .vocabrow button{ background:none; border:none; color:var(--dim); cursor:pointer; padding:2px 6px; font-size:13px; }

  .sheetOverlay{ position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:30; }
  .sheetOverlay.hidden{ display:none; }
  .actionSheet{ width:100%; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .actionSheet button{ padding:13px; font-size:15px; border-radius:8px; }

  .cropperOverlay{ position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:40; display:flex; align-items:center; justify-content:center; }
  .cropperOverlay.hidden{ display:none; }
  .cropperBox{ background:var(--sheet-bg); color:var(--text-main); border-radius:12px; padding:16px; width:86%; max-width:300px; text-align:center; }
  .cropperViewport{ width:230px; height:230px; margin:0 auto; border-radius:50%; overflow:hidden; position:relative; background:#000; touch-action:none; border:2px solid var(--border); cursor:grab; }
  .cropperViewport img{ position:absolute; top:0; left:0; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .cropperControls{ margin-top:12px; display:flex; align-items:center; gap:8px; }
  .cropperControls span{ font-size:12px; color:var(--dim); }
  .cropperControls input[type=range]{ flex:1; }
  .cropperButtons{ display:flex; gap:8px; margin-top:12px; }
  .cropperButtons button{ flex:1; padding:10px; border-radius:8px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <button class="hdrbtn glossy invisible" id="headerLeft"></button>
    <div class="titlewrap">
      <div class="title" id="title">人工無脳</div>
      <div class="subtitle" id="subtitle">読込中…</div>
    </div>
    <button class="hdrbtn glossy invisible" id="headerRight"></button>
  </div>

  <div class="tabpanel" id="panel-home">
    <div class="listwrap" id="homeListWrap"></div>

    <div class="panel hidden" id="homeBotProfile">
      <div class="profilewrap">
        <div class="profilebanner" id="profileBanner"></div>
        <div class="profileavatarwrap">
          <div class="avatar profileavatar" id="profileAvatar"></div>
        </div>
        <div class="profilename" id="profileName"></div>
        <div class="profilestatus" id="profileStatus"></div>
        <div class="profileactions">
          <button class="glossy" id="profileOpenChatBtn">トークを開く</button>
          <button class="glossy" id="profileOpenSettingsBtn">設定</button>
        </div>
      </div>
    </div>

    <div class="panel hidden" id="homeBotChat">
      <div class="log" id="homeBotLog"></div>
      <div class="replypreview hidden" id="homeBotReplyPreview">
        <div class="replyinfo"><div class="replyname"></div><div class="replytext"></div></div>
        <button class="replycancel" id="homeBotReplyCancel" type="button">✕</button>
      </div>
      <div class="inputbar">
        <button class="photobtn glossy" id="homeBotPhotoBtn" type="button">📷</button>
        <input type="file" id="homeBotPhotoFile" accept="image/*" style="display:none;">
        <input type="text" id="homeBotInput" placeholder="新しいメッセージ" autocomplete="off">
        <button id="homeBotSend" class="glossy">送信</button>
      </div>
    </div>

    <div class="panel hidden" id="homeBotSettings">
      <div class="settingswrap">
        <div class="section">
          <div class="section-title">一般</div>
          <div class="filerow"><label class="glossy">ユーザーのアイコン<input type="file" id="userAvatarFile" accept="image/*"></label></div>
          <div class="filerow" style="margin-top:6px;"><label class="glossy">会話相手のアイコン<input type="file" id="botSettingsAvatarFile" accept="image/*"></label></div>
          <button class="actionbtn glossy" id="botSettingsRename">名前の変更</button>
          <div class="bgpreview" id="botSettingsBgPreview" style="margin-top:8px;"></div>
          <div class="filerow"><label class="glossy">背景を設定する<input type="file" id="botSettingsBgFile" accept="image/*"></label></div>
          <button class="actionbtn glossy" id="botSettingsExport">トーク履歴を送信</button>
          <div class="switchrow" style="margin-top:10px;">
            <span>文字の読み上げ</span>
            <label class="switch"><input type="checkbox" id="botSettingsTts"><span class="slider"></span></label>
          </div>
        </div>
        <div class="section">
          <div class="section-title">その他</div>
          <button class="actionbtn glossy" id="botSettingsClearLog">会話履歴の削除</button>
          <button class="actionbtn glossy danger" id="botSettingsClearVocab">学習内容の削除</button>
          <button class="actionbtn glossy danger" id="botSettingsDelete">この人工無脳を削除</button>
        </div>
        <div class="section">
          <div class="section-title">上級者用</div>
          <div class="switchrow">
            <span>学習を止める</span>
            <label class="switch"><input type="checkbox" id="botSettingsPause"><span class="slider"></span></label>
          </div>
          <div style="display:flex; gap:6px; margin-top:10px;">
            <input type="text" id="botSettingsDirectWord" class="forminput" placeholder="覚えさせたい言葉">
            <button class="glossy" id="botSettingsDirectAdd" style="padding:8px 12px;">追加</button>
          </div>
          <div class="section-title" style="margin-top:12px;">学習した記憶を指定して削除</div>
          <div id="botSettingsVocabList" style="max-height:180px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>

    <div class="panel hidden" id="homeGroupChat">
      <div class="log" id="homeGroupLog"></div>

/* ---- 保存先の自動切り替え ---- */
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
function lsKey(key, shared){ return 'jinkoumunou:' + (shared ? 'shared:' : '') + key; }
async function storageGet(key, shared){
  if(hasClaudeStorage){ try{ return await window.storage.get(key, shared); }catch(e){ return null; } }
  try{ const v = localStorage.getItem(lsKey(key, shared)); return v !== null ? { key, value:v, shared:!!shared } : null; }
  catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(hasClaudeStorage){ try{ return await window.storage.set(key, value, shared); }catch(e){ return null; } }
  try{ localStorage.setItem(lsKey(key, shared), value); return { key, value, shared:!!shared }; }
  catch(e){ return null; }
}
async function storageDelete(key, shared){
  if(hasClaudeStorage){ try{ return await window.storage.delete(key, shared); }catch(e){ return null; } }
  try{ localStorage.removeItem(lsKey(key, shared)); return { key, deleted:true, shared:!!shared }; }
  catch(e){ return null; }
}

/* ---- 断片化・生成ロジック ---- */
function isMeaningfulFragment(f){
  return typeof f === 'string' && f.replace(/[。！？!?.\s]/g, '').length > 0;
}
function capFragmentFrequency(vocab, maxCount){
  const counts = {};
  const out = [];
  for(const f of vocab){
    counts[f] = (counts[f]||0) + 1;
    if(counts[f] <= maxCount) out.push(f);
  }
  return out;
}
function splitKeepingEnd(str){
  const out = [];
  let cur = '';
  let i = 0;
  while(i < str.length){
    const ch = str[i];
    cur += ch;
    if('。！？!?'.includes(ch)){
      let j = i + 1;
      while(j < str.length && '。！？!?'.includes(str[j])){ cur += str[j]; j++; }
      i = j;
      if(isMeaningfulFragment(cur)) out.push(cur.trim());
      cur = '';
      continue;
    }
    i++;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function tokenize(text){
  const byComma = text.split(/[、,\n]+/).map(s=>s.trim()).filter(Boolean);
  const frags = [];
  for(const p of byComma) frags.push(...splitKeepingEnd(p));
  return frags.filter(f=>isMeaningfulFragment(f));
}
function isLatinText(s){
  const hasJapanese = /[\u3040-\u30ff\u3400-\u9fff]/.test(s);
  const hasLatin = /[A-Za-z]/.test(s);
  return hasLatin && !hasJapanese;
}
function endMarks(s){
  return isLatinText(s) ? {q:'?', e:'!', p:'.'} : {q:'？', e:'！', p:'。'};
}
function stripEndPunct(s){
  return s.replace(/[。！？!?.]+$/, '');
}
function randomEnding(text){
  const marks = endMarks(text);
  if(/[。！？!?.]$/.test(text)){
    if(Math.random() < 0.05) return text.replace(/[。！？!?.]$/, marks.q);
    return text;
  }
  const r = Math.random();
  if(r < 0.12) return text + marks.q;
  if(r < 0.18) return text + marks.e;
  return text;
}
function pickCombineCount(poolSize){
  if(poolSize<=1) return 1;
  const growth = Math.min(poolSize/40, 1);
  const r = Math.random();
  const p1 = 0.35 - growth*0.2;
  const p2 = p1 + (0.4 + growth*0.1);
  if(r < p1) return 1;
  if(r < p2) return 2;
  return poolSize>=3 ? 3 : 2;
}
function spliceFragments(a, b){
  if(a.length < 2 || b.length < 2) return a + b;
  const cut1 = 1 + Math.floor(Math.random()*(a.length-1));
  const cut2 = 1 + Math.floor(Math.random()*(b.length-1));
  return a.slice(0, cut1) + b.slice(cut2);
}
function generateReply(vocabPool, currentFragments){
  const vocabSize = vocabPool ? vocabPool.length : 0;
  const parrotChance = Math.max(0.12, 0.30 - vocabSize/300);
  if(currentFragments && currentFragments.length > 0 && Math.random() < parrotChance){
    return randomEnding(pick(currentFragments));
  }
  const pool = (vocabPool && vocabPool.length > 0) ? vocabPool : currentFragments;
  if(!pool || pool.length === 0) return '…';

  // 覚えた言葉同士を混ぜて、単なる連結以上の「自分なりの言葉」を作ることがある
  if(pool.length >= 2 && Math.random() < 0.3){
    const a = pick(pool), b = pick(pool);
    if(a !== b){
      const blended = spliceFragments(stripEndPunct(a), stripEndPunct(b));
      if(blended.length >= 2) return randomEnding(blended);
    }
  }

  const combineCount = pickCombineCount(pool.length);
  let parts = [];
  for(let i=0;i<combineCount;i++) parts.push(stripEndPunct(pick(pool)));
  let base = parts[0];
  for(let i=1;i<parts.length;i++){
    base += (Math.random() < 0.3 ? '、' : '') + parts[i];
  }
  return randomEnding(base);
}
function botsHear(botIds, text){
  const frags = tokenize(text);
  if(frags.length === 0) return;
  const idSet = new Set(botIds);
  bots.forEach(b=>{
    if(idSet.has(b.id) && !b.learningPaused){
      if(!b.vocab) b.vocab = [];
      b.vocab.push(...frags);
      if(b.vocab.length > MAX_VOCAB) b.vocab = b.vocab.slice(b.vocab.length - MAX_VOCAB);
    }
  });
}
function plazaEligibleBots(){
  return plazaParticipantIds === null ? bots : bots.filter(b=>plazaParticipantIds.includes(b.id));
}

function renderMsg(entry, containerId, showName, contextType, contextId){
  const log = document.getElementById(containerId || 'homeBotLog');

    const qt = document.createElement('div'); qt.className='quotetext'; qt.textContent = entry.replyTo.text;
    q.appendChild(qn); q.appendChild(qt);
    col.appendChild(q);
  }
  let bubble;
  if(entry.kind === 'image'){
    bubble = document.createElement('div');
    bubble.className = 'bubble imagebubble ' + entry.who;
    const img = document.createElement('img');
    img.src = entry.image; img.className = 'msgimage';
    bubble.appendChild(img);
  } else {
    bubble = document.createElement('div');
    bubble.className = 'bubble ' + entry.who;
    bubble.textContent = entry.text;
  }
  col.appendChild(bubble);
  if(entry.mid && contextType){
    col.appendChild(renderReactionRow(entry, contextType, contextId));
  }
  let timeEl = null;
  if(entry.ts){
    timeEl = document.createElement('div');
    timeEl.className = 'msgtime-side';
    timeEl.textContent = formatTime(entry.ts);
  }
  if(entry.who === 'bot'){
    row.appendChild(avatarEl(entry.botName, entry.botColor, entry.botAvatar));
    row.appendChild(col);
    if(timeEl) row.appendChild(timeEl);
  } else {
    if(timeEl) row.appendChild(timeEl);
    row.appendChild(col);
    if(userAvatar) row.appendChild(avatarEl('あなた', '#4fbf67', userAvatar));
  }
  if(entry.mid) attachSwipeReply(row, entry);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}
function attachSwipeReply(row, entry){
  let startX = 0, startY = 0, tracking = false;
  row.style.touchAction = 'pan-y';
  row.addEventListener('pointerdown', e=>{ tracking = true; startX = e.clientX; startY = e.clientY; });
  row.addEventListener('pointerup', e=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(dx < -50 && Math.abs(dx) > Math.abs(dy) * 1.5){
      setReplyTarget(entry);
    }
  });
  row.addEventListener('pointercancel', ()=>{ tracking = false; });
}
function setReplyTarget(entry){
  replyTarget = { mid: entry.mid, name: entry.who==='bot' ? entry.botName : 'あなた', text: entry.text };
  renderReplyPreview();
}
function clearReplyTarget(){ replyTarget = null; renderReplyPreview(); }
function renderReplyPreview(){

let groupVoteTimer = null;
function computeVotes(entry){
  const voters = (entry.votes && entry.votes.voters) || {};
  let up = 0, down = 0;
  Object.values(voters).forEach(v=>{ if(v==='up') up++; else if(v==='down') down++; });
  return { up, down };
}
function renderVoteRow(entry, groupId){
  const row = document.createElement('div');
  row.className = 'voterow';
  row.dataset.mid = entry.mid;
  const upBtn = document.createElement('button'); upBtn.type = 'button';
  const downBtn = document.createElement('button'); downBtn.type = 'button';
  upBtn.addEventListener('click', ()=> castUserVote(entry, 'up', groupId));
  downBtn.addEventListener('click', ()=> castUserVote(entry, 'down', groupId));
  row.appendChild(upBtn); row.appendChild(downBtn);
  paintVoteRow(row, entry);
  return row;
}
function paintVoteRow(row, entry){
  const { up, down } = computeVotes(entry);
  const myVote = entry.votes && entry.votes.voters && entry.votes.voters['user'];
  const upBtn = row.children[0], downBtn = row.children[1];
  upBtn.className = 'votebtn' + (myVote==='up' ? ' active' : '');
  downBtn.className = 'votebtn' + (myVote==='down' ? ' active' : '');
  upBtn.innerHTML = THUMB_UP_SVG + `<span>${up}</span>`;
  downBtn.innerHTML = THUMB_DOWN_SVG + `<span>${down}</span>`;
}
function refreshVoteRow(entry){
  const row = document.querySelector(`.voterow[data-mid="${entry.mid}"]`);
  if(row) paintVoteRow(row, entry);
}
function checkMessageKick(entry, group){
  if(!group || !entry || entry.who !== 'bot') return;
  if(!group.memberIds.includes(entry.botId)) return;
  const { down } = computeVotes(entry);
  const total = group.memberIds.length;
  const threshold = Math.floor(total/2) + 1; // 過半数
  if(down >= threshold){
    group.memberIds = group.memberIds.filter(id=>id!==entry.botId);
    const bot = bots.find(b=>b.id===entry.botId);
    const noteText = `${bot?bot.name:'?'} は低評価が過半数を超えたため、グループから退出させられました。`;
    if(!groupChats[group.id]) groupChats[group.id] = [];
    groupChats[group.id].push({ who:'system', text:noteText, ts:Date.now() });
    if(currentTab==='home' && homeSubView==='groupchat' && currentGroupId===group.id){
      addSystemNote('homeGroupLog', noteText);
    }
  }
}
async function castUserVote(entry, choice, groupId){
  if(!entry.votes) entry.votes = { voters:{} };
  if(entry.votes.voters['user'] === choice){
    delete entry.votes.voters['user'];
  } else {
    entry.votes.voters['user'] = choice;
  }
  const group = groups.find(g=>g.id===groupId);
  checkMessageKick(entry, group);
  refreshVoteRow(entry);
  await Promise.all([saveGroupChats(), saveGroups(), saveBots()]);
}

function computeReactionCounts(entry){
  const counts = {};
  const reactions = entry.reactions || {};
  Object.values(reactions).forEach(e=>{ counts[e] = (counts[e]||0)+1; });
  return counts;
}
function renderReactionRow(entry, contextType, contextId){
  const row = document.createElement('div');
  row.className = 'reactrow';
  row.dataset.mid = entry.mid;
  row.dataset.ctxType = contextType;

  return row;
}
function paintReactionRow(row, entry){
  row.innerHTML = '';
  const contextType = row.dataset.ctxType, contextId = row.dataset.ctxId;
  const counts = computeReactionCounts(entry);
  const myReaction = entry.reactions && entry.reactions['user'];
  Object.keys(counts).forEach(emoji=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'reactchip' + (myReaction===emoji ? ' active' : '');
    chip.textContent = `${emoji} ${counts[emoji]}`;
    chip.addEventListener('click', async ()=>{
      if(!entry.reactions) entry.reactions = {};
      if(entry.reactions['user'] === emoji) delete entry.reactions['user'];
      else entry.reactions['user'] = emoji;

    });

function stopGroupVoteTicker(){ if(groupVoteTimer){ clearInterval(groupVoteTimer); groupVoteTimer = null; } }
function startGroupVoteTicker(groupId){
  stopGroupVoteTicker();
  groupVoteTimer = setInterval(async ()=>{
    if(currentTab !== 'home' || homeSubView !== 'groupchat' || currentGroupId !== groupId) return;
    const group = groups.find(g=>g.id===groupId);
    if(!group) return;
    const allMsgs = (groupChats[groupId] || []).filter(e=>e.who !== 'system');
    if(allMsgs.length === 0) return;

    if(likeDislikeEnabled && Math.random() < 0.5){
      const botMsgs = allMsgs.filter(e=>e.who==='bot' && group.memberIds.includes(e.botId));
      if(botMsgs.length === 0) return;
      const entry = pick(botMsgs);
      const eligible = group.memberIds.filter(id=>id !== entry.botId);
      if(eligible.length === 0) return;
      const voterId = pick(eligible);
      if(!entry.votes) entry.votes = { voters:{} };
      entry.votes.voters[voterId] = Math.random() < 0.5 ? 'up' : 'down';
      checkMessageKick(entry, group);
      refreshVoteRow(entry);
      await Promise.all([saveGroupChats(), saveGroups(), saveBots()]);
    } else {
      const entry = pick(allMsgs);
      const senderId = entry.who === 'bot' ? entry.botId : null;
      const eligible = group.memberIds.filter(id=>id !== senderId);
      if(eligible.length === 0) return;
      const reactorId = pick(eligible);
      if(!entry.reactions) entry.reactions = {};
      entry.reactions[reactorId] = pick(REACTION_EMOJIS);
      refreshReactionRow(entry);
      await saveGroupChats();
    }
  }, 3000 + Math.random()*3000);
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function resizeAvatarFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = Math.min(img.width, img.height);
        const sx = (img.width-size)/2, sy = (img.height-size)/2;
        const target = 160;
        const canvas = document.createElement('canvas');
        canvas.width = target; canvas.height = target;
        canvas.getContext('2d').drawImage(img, sx, sy, size, size, 0, 0, target, target);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- アイコンの位置調整(クロッパー) ---- */
const CROP_VP = 230;
const CROP_OUT = 320;
let cropperState = { img:null, naturalW:0, naturalH:0, baseScale:1, zoom:1, offsetX:0, offsetY:0, dragging:false, startX:0, startY:0, startOffsetX:0, startOffsetY:0, onConfirm:null };
function openCropper(file, onConfirm){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      cropperState.img = img;
      cropperState.naturalW = img.naturalWidth;
      cropperState.naturalH = img.naturalHeight;
      cropperState.baseScale = Math.max(CROP_VP/img.naturalWidth, CROP_VP/img.naturalHeight);
      cropperState.zoom = 1;
      const dispW = img.naturalWidth*cropperState.baseScale, dispH = img.naturalHeight*cropperState.baseScale;
      cropperState.offsetX = (CROP_VP-dispW)/2;
      cropperState.offsetY = (CROP_VP-dispH)/2;
      cropperState.onConfirm = onConfirm;
      document.getElementById('cropperImg').src = reader.result;
      document.getElementById('cropperZoom').value = 1;
      updateCropperTransform();
      document.getElementById('cropperOverlay').classList.remove('hidden');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function updateCropperTransform(){
  const s = cropperState.baseScale * cropperState.zoom;
  const dispW = cropperState.naturalW*s, dispH = cropperState.naturalH*s;
  const minX = CROP_VP-dispW, maxX = 0;
  const minY = CROP_VP-dispH, maxY = 0;
  cropperState.offsetX = Math.min(maxX, Math.max(minX, cropperState.offsetX));
  cropperState.offsetY = Math.min(maxY, Math.max(minY, cropperState.offsetY));
  const el = document.getElementById('cropperImg');
  el.style.width = dispW+'px';
  el.style.height = dispH+'px';
  el.style.transform = `translate(${cropperState.offsetX}px, ${cropperState.offsetY}px)`;
}
(function setupCropperEvents(){
  const vp = document.getElementById('cropperViewport');
  vp.addEventListener('pointerdown', e=>{
    if(!cropperState.img) return;
    cropperState.dragging = true;
    cropperState.startX = e.clientX; cropperState.startY = e.clientY;
    cropperState.startOffsetX = cropperState.offsetX; cropperState.startOffsetY = cropperState.offsetY;
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e=>{
    if(!cropperState.dragging) return;
    cropperState.offsetX = cropperState.startOffsetX + (e.clientX - cropperState.startX);
    cropperState.offsetY = cropperState.startOffsetY + (e.clientY - cropperState.startY);
    updateCropperTransform();
  });
  vp.addEventListener('pointerup', ()=>{ cropperState.dragging = false; });
  vp.addEventListener('pointercancel', ()=>{ cropperState.dragging = false; });
  document.getElementById('cropperZoom').addEventListener('input', e=>{
    cropperState.zoom = parseFloat(e.target.value);
    updateCropperTransform();
  });
  document.getElementById('cropperCancel').addEventListener('click', ()=>{
    document.getElementById('cropperOverlay').classList.add('hidden');
    cropperState.img = null;
  });
  document.getElementById('cropperConfirm').addEventListener('click', ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = CROP_OUT; canvas.height = CROP_OUT;
    const outScale = CROP_OUT/CROP_VP;
    const s = cropperState.baseScale * cropperState.zoom * outScale;
    canvas.getContext('2d').drawImage(
      cropperState.img,
      cropperState.offsetX*outScale, cropperState.offsetY*outScale,
      cropperState.naturalW*s, cropperState.naturalH*s
    );
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    document.getElementById('cropperOverlay').classList.add('hidden');
    const cb = cropperState.onConfirm;
    cropperState.img = null;
    if(cb) cb(dataUrl);
  });
})();

async function handleBotSend(){
  const input = document.getElementById('homeBotInput');
  const text = input.value.trim();
  if(!text || !currentBotId) return;
  const bot = bots.find(b=>b.id===currentBotId);
  if(!bot) return;
  const userEntry = { who:'user', text, ts:Date.now(), mid:uid() };
  if(replyTarget) userEntry.replyTo = { name:replyTarget.name, text:replyTarget.text };
  clearReplyTarget();
  if(!individualChats[bot.id]) individualChats[bot.id] = [];
  individualChats[bot.id].push(userEntry);
  checkDateSeparator('homeBotLog', userEntry.ts, homeBotDayState);
  renderMsg(userEntry, 'homeBotLog', false, 'bot', bot.id);
  botsHear([bot.id], text);
  const frags = tokenize(text);
  input.value = '';
  await delay(250 + Math.random()*400);
  const reply = generateReply(bot.vocab, frags);
  const botEntry = { who:'bot', text:reply, botId:bot.id, botName:bot.name, botColor:bot.color, botAvatar:bot.avatar||null, ts:Date.now(), mid:uid() };
  individualChats[bot.id].push(botEntry);

  botsHear([bot.id], reply);

    if(!userEntry.reactions) userEntry.reactions = {};
    userEntry.reactions[bot.id] = pick(REACTION_EMOJIS);
    refreshReactionRow(userEntry);
  }
  if(bot.ttsEnabled) speak(reply);
  if(individualChats[bot.id].length > MAX_LOG) individualChats[bot.id] = individualChats[bot.id].slice(individualChats[bot.id].length - MAX_LOG);
  await Promise.all([saveBots(), saveIndividualChats()]);

  const text = input.value.trim();
  if(!text || !currentGroupId) return;
  const group = groups.find(g=>g.id===currentGroupId);
  if(!group) return;
  const memberBots = bots.filter(b=>group.memberIds.includes(b.id));
  if(memberBots.length === 0) return;
  const showName = memberBots.length > 1;

  const userEntry = { who:'user', text, ts:Date.now(), mid:uid() };
  if(replyTarget) userEntry.replyTo = { name:replyTarget.name, text:replyTarget.text };
  clearReplyTarget();
  if(!groupChats[group.id]) groupChats[group.id] = [];

  renderGroupEntry(userEntry, showName, group.id);
  botsHear(group.memberIds, text);
  const frags = tokenize(text);
  input.value = '';

  const mentioned = memberBots.filter(b => text.includes('@'+b.name));
  let responders;
  if(mentioned.length > 0){
    responders = mentioned.slice();
    memberBots.filter(b=>!mentioned.includes(b)).forEach(b=>{ if(Math.random() < 0.3) responders.push(b); });
  } else {
    responders = memberBots.length === 1 ? memberBots.slice() : memberBots.filter(()=>Math.random() < 0.65);
    if(responders.length === 0) responders = [pick(memberBots)];
  }
  responders = responders.slice().sort(()=>Math.random()-0.5);

  for(const bot of responders){
    await delay(250 + Math.random()*400);
    const reply = generateReply(bot.vocab, frags);
    const botEntry = { who:'bot', text:reply, botId:bot.id, botName:bot.name, botColor:bot.color, botAvatar:bot.avatar||null, ts:Date.now(), mid:uid() };
    groupChats[group.id].push(botEntry);
    renderGroupEntry(botEntry, showName, group.id);
    bot.lastMessage = reply; bot.lastTime = Date.now();
    botsHear([bot.id], reply);
  }
  const last = groupChats[group.id][groupChats[group.id].length-1];
  group.lastMessage = last ? last.text : group.lastMessage;
  group.lastTime = Date.now();
  if(groupChats[group.id].length > MAX_LOG) groupChats[group.id] = groupChats[group.id].slice(groupChats[group.id].length - MAX_LOG);
  await Promise.all([saveBots(), saveGroups(), saveGroupChats()]);
}

/* ---- @メンション ---- */
function setupMentionTrigger(inputId, getMembers){
  const input = document.getElementById(inputId);
  input.addEventListener('input', ()=>{
    if(input.value.endsWith('@')){
      const members = getMembers();
      if(members.length > 0) showMentionPicker(inputId, members);
    }
  });
}
function showMentionPicker(inputId, members){
  mentionActiveInputId = inputId;
  const wrap = document.getElementById('mentionList');
  wrap.innerHTML = '';
  members.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'glossy';
    btn.style.cssText = 'display:block;width:100%;text-align:left;padding:10px;margin-top:6px;';
    btn.textContent = b.name;
    btn.addEventListener('click', ()=>{
      const input = document.getElementById(mentionActiveInputId);
      input.value = input.value.slice(0, -1) + '@' + b.name + ' ';
      document.getElementById('mentionOverlay').classList.add('hidden');
      input.focus();
    });
    wrap.appendChild(btn);
  });
  document.getElementById('mentionOverlay').classList.remove('hidden');
}
document.getElementById('mentionCancel').addEventListener('click', ()=>{
  document.getElementById('mentionOverlay').classList.add('hidden');
});
setupMentionTrigger('homeBotInput', ()=> currentBotId ? [bots.find(b=>b.id===currentBotId)].filter(Boolean) : []);
setupMentionTrigger('homeGroupInput', ()=>{
  const group = groups.find(g=>g.id===currentGroupId);
  if(!group) return [];
  return bots.filter(b=>group.memberIds.includes(b.id));
});

/* ---- ひろば（自動投稿） ---- */
function startPlaza(){
  if(!plazaEnabled) return;
  if(plazaTimer) return;
  scheduleNextPlazaTick(true);
}
function stopPlaza(){
  if(plazaTimer){ clearTimeout(plazaTimer); plazaTimer = null; }
}
function intervalRange(){
  if(plazaIntervalMode === 'fast') return [1000, 3000];
  if(plazaIntervalMode === 'slow') return [8000, 20000];
  return [3000, 8000];
}
function scheduleNextPlazaTick(immediateFirst){
  const [min, max] = intervalRange();
  const wait = immediateFirst ? 800 : min + Math.random()*(max-min);
  plazaTimer = setTimeout(async ()=>{
    await plazaTick();
    if(currentTab === 'plaza' && plazaSubView === 'feed' && plazaEnabled) scheduleNextPlazaTick(false);
    else plazaTimer = null;
  }, wait);
}
async function plazaTick(){
  if(!plazaEnabled) return;
  const pool = plazaEligibleBots().filter(b=> b.vocab && b.vocab.length > 0);
  if(pool.length === 0) return;
  const bot = pick(pool);
  const reply = generateReply(bot.vocab, []);
  const entry = { who:'bot', text:reply, botId:bot.id, botName:bot.name, botColor:bot.color, botAvatar:bot.avatar||null, ts:Date.now() };
  plazaLog.push(entry);
  renderPlazaMsg(entry);
  trimAndSavePlaza();
  bot.lastMessage = reply; bot.lastTime = Date.now();
  botsHear(plazaEligibleBots().map(b=>b.id), reply);
  await saveBots();
  if(currentTab === 'plaza') updateHeader();
}

/* ---- ひろば設定 ---- */
function renderPlazaSettingsForm(){
  document.getElementById('plazaEnabledToggle').checked = plazaEnabled;
  document.getElementById('plazaBgPreview').style.backgroundImage = plazaBg ? `url(${plazaBg})` : '';
  document.getElementById('plazaIntervalSelect').value = plazaIntervalMode;
  const wrap = document.getElementById('plazaMembers');
  wrap.innerHTML = '';
  if(bots.length === 0){
    wrap.innerHTML = '<div class="listpreview">先に人工無脳を作成してください。</div>';
    return;
  }
  const activeSet = new Set(plazaParticipantIds === null ? bots.map(b=>b.id) : plazaParticipantIds);
  bots.forEach(b=>{
    const row = document.createElement('label');
    row.className = 'memberrow';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = activeSet.has(b.id);
    cb.addEventListener('change', async ()=>{
      if(plazaParticipantIds === null) plazaParticipantIds = bots.map(x=>x.id);
      if(cb.checked){ if(!plazaParticipantIds.includes(b.id)) plazaParticipantIds.push(b.id); }
      else { plazaParticipantIds = plazaParticipantIds.filter(id=>id!==b.id); }
      await storageSet('jinkoumunou-plaza-participants', JSON.stringify(plazaParticipantIds), false);
    });
    const av = avatarEl(b.name, b.color, b.avatar);
    const nm = document.createElement('span'); nm.textContent = b.name;
    row.appendChild(cb); row.appendChild(av); row.appendChild(nm);
    wrap.appendChild(row);
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const lines = [];
  bots.forEach(b=>{
    const h = individualChats[b.id] || [];
    if(h.length === 0) return;
    lines.push(`==== 個人チャット: ${b.name} ====`);
    h.forEach(e=> lines.push(`[${e.ts||''}] ${e.who==='user' ? 'あなた' : b.name}: ${e.text}`));
    lines.push('');
  });
  groups.forEach(g=>{
    const h = groupChats[g.id] || [];
    if(h.length === 0) return;
    lines.push(`==== グループ: ${g.name} ====`);
    h.forEach(e=> lines.push(`[${e.ts||''}] ${e.who==='user' ? 'あなた' : (e.botName||'人工無脳')}: ${e.text}`));
    lines.push('');
  });
  if(plazaLog.length > 0){
    lines.push('==== ひろば ====');
    plazaLog.forEach(e=> lines.push(`[${e.ts||''}] ${e.botName||'人工無脳'}: ${e.text}`));
  }
  downloadText(lines.join('\n'), `jinkoumunou_log_${Date.now()}.txt`);
});
